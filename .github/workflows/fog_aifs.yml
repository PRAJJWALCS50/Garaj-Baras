name: AIFS fog worker

# Newest ECMWF AIFS Single run -> fog forecast grids (0..72 h) -> Supabase Storage.
# AIFS runs 4x a day (00/06/12/18 UTC) and is published as free open data as soon
# as it is produced; checking hourly picks each run up shortly after release.
# Already-processed runs exit in seconds.
#
# Repo secrets needed (already set for the satellite worker):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# No ECMWF account is needed (open data, CC-BY-4.0).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Optional AIFS run to (re)process, e.g. 2026-11-26T00 (only the last ~4 days exist)"
        required: false

concurrency:
  group: fog-aifs
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: aifs_worker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aifs_worker/requirements.txt
      - run: pip install -r aifs_worker/requirements.txt
      - name: Process newest AIFS run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.run }}" ]; then
            python aifs_worker/run.py --run "${{ github.event.inputs.run }}" --force
          else
            python aifs_worker/run.py
          fi
